group = "dev.sciwhiz12"
version = "0.1"

afterEvaluate {
    final isCI = Boolean.parseBoolean(project.findProperty('isCI') as String) || Boolean.parseBoolean(System.getenv('CI'))
    if (isCI) {
        println('Running on CI.')
        println("CI_VERSION=$version")
        println("CI_GROUP=$group")
        println("CI_ARTIFACT=parchment-${20}")
        println("CI_GAME_VERSION=${20}")
    }
}